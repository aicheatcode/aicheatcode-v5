name: AICHEATCODE V5 - Automated QA
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: SQLite verification
        run: pnpm run test:sqlite
      - name: Catalog tests
        run: node scripts/test-catalog.mjs
      - name: Integration tests
        run: node scripts/test-integration.mjs
      - name: Editor tests
        run: node scripts/test-editor.mjs
      - name: Prompt flows
        run: node scripts/test-repaired-flows.mjs
      - name: Cloudflare deployment safeguards
        run: pnpm run test:cloudflare
      - name: CMS structured content and Access JWT tests
        run: node --test tests/cms.test.mjs
      - name: Server tests
        run: node scripts/test-server.mjs
      - name: Production build
        run: pnpm run build
      - name: Worker and local D1 HTTP integration
        run: node scripts/test-d1-worker.mjs
      - name: Package the verified Worker build
        run: tar -czf worker-build.tar.gz dist
      - name: Upload verified Worker build
        uses: actions/upload-artifact@v4
        with:
          name: worker-build-${{ github.sha }}
          path: worker-build.tar.gz
          retention-days: 3
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: |
            docs/verification/
            SQL_VALIDATION.json
          if-no-files-found: warn
  production-configuration:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - name: Check required Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::BLOCKED: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub Secrets.'
            echo '## Cloudflare production: BLOCKED' >> "$GITHUB_STEP_SUMMARY"
            echo 'Required Cloudflare secrets are missing. No database or Worker changes were attempted; production is not PASS.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
  deploy-production:
    needs: [validate, production-configuration]
    if: needs.production-configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - name: Install the locked deployment tooling
        run: pnpm install --frozen-lockfile
      - name: Download the build that passed validation
        uses: actions/download-artifact@v4
        with:
          name: worker-build-${{ github.sha }}
      - name: Extract verified build
        run: tar -xzf worker-build.tar.gz
      - name: Provision D1, migrate, seed, deploy and test production
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
          CMS_OWNER_EMAIL: ${{ vars.CMS_OWNER_EMAIL }}
        run: pnpm run deploy:cloudflare
      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-evidence
          path: .cloudflare/production/report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
